 Impresora",sub:"Limpieza profunda y electrónica",tag:"TALLER"},{src:Da,caption:"Reparación interior Plotter",sub:"Correa, carro y estación de servicio",tag:"PLOTTER"},{src:da,caption:"Reparación Multifuncional Abierta",sub:"Unidad de imagen y revelado",tag:"MULTIFUNCIONAL"}],c0=[{id:"hp-no-imprime",date:"12 Nov 2024",read:"6 min lectura",title:"Por qué mi impresora HP no imprime y cómo solucionarlo",excerpt:"Luz naranja parpadeando, cola de impresión trabada o driver corrupto. Te explicamos las 5 causas más comunes en Santiago y qué revisar antes de llamar al técnico.",content:`
      En Santiago, el 70% de las llamadas que recibimos por impresoras HP son por el mismo patrón: manda a imprimir, queda en cola y no sale nada. Antes de desesperarte, haz esto en orden.

      **1. Cola de impresión saturada.** En Windows, ve a Panel de Control > Dispositivos e impresoras > Ver lo que se está imprimiendo. Si ves 10 documentos pegados, cancela todo. Reinicia el servicio "Cola de impresión" desde services.msc. En oficinas con red, muchas veces es una persona que mandó un PDF de 200MB que bloquea a todos.

      **2. Driver universal vs driver específico.** El driver universal de HP es cómodo, pero en LaserJet 107w, M12, M28 falla. Baja el driver Full Feature desde hp.com según tu modelo exacto. En Windows 11, desactiva la instalación automática de drivers para que no lo sobrescriba.

      **3. Papel húmedo y rodillo pickup.** La humedad de Santiago en invierno hace que el papel se curve. Usa resma nueva, no recicles hojas que pasaron por la impresora. Si toma varias hojas, limpia el rodillo pickup con paño húmedo con agua destilada, no alcohol.

      **4. Firmware y cartucho no original.** Algunas HP M28w bloquean cartuchos alternativos si actualizas firmware. Si te sale "cartucho no compatible", baja firmware anterior desde soporte HP o usa chip reseteable. Nosotros instalamos alternativas con chip que no dan error.

      **5. Cuando llamar.** Si la luz naranja parpadea 3 veces seguidas, es fusor. Si imprime en blanco, es láser o tóner descargado. En esos casos, la visita sin costo aplica: vamos, medimos voltaje de fusor, probamos tóner de prueba y te dices costo real. No cambies piezas al azar.

      Tip final: nunca uses aire comprimido dentro de una láser. Dispersa el tóner residual y daña el láser. Usa aspiradora con filtro HEPA.
    `},{id:"plotter-mantenimiento",date:"28 Oct 2024",read:"8 min lectura",title:"Mantenimiento preventivo de plotter: alarga su vida útil",excerpt:"Un HP DesignJet sin mantención pierde 40% de calidad en 18 meses. Checklist mensual que usan nuestros técnicos para estudios de arquitectura en Las Condes y Providencia.",content:`
      Un plotter es como un auto: si solo lo usas y nunca lo mantienes, muere a los 3 años. En estudios de arquitectura de Santiago vemos plotter HP T230 y T650 de 2 años con líneas blancas porque nunca limpiaron la estación de servicio.

      **Checklist que dejamos a clientes con contrato:**

      **Semanal:** Imprime un test de inyectores. Si ves un color cortado, haz limpieza nivel 1 desde el panel, no desde el PC. No hagas 3 limpiezas seguidas, ahogas el cabezal. Limpia la varilla de carro con paño sin pelusa.

      **Mensual:** Revisa el strip encoder (la cinta transparente detrás del carro). Si está manchado con tinta, es la causa #1 de error 02.1. Límpialo con cotonito y agua destilada, con el plotter apagado. Revisa que el rollo esté bien puesto; un rollo torcido fuerza el motor de papel y quema la tarjeta.

      **Trimestral (técnico):** Lubricación de riel con grasa teflonada, no WD-40. Limpieza de estación de cap y bomba de purga. Calibración de avance de papel (paper advance calibration) para que el plano de 90cm no salga de 89.7cm. Medición de correa: si tiene más de 2mm de juego, se cambia antes que corte.

      **Errores típicos en Chile:** Error 21:13 es falta de mantención, no falla de cabezal. Error 79:04 en T120-T830 es firmware, no placa. Antes de comprar cabezal de $280.000, haz servicio.

      En empresas con más de 50 planos al mes, recomendamos contrato: visita cada 90 días, incluye limpieza y reporte con fotos. Sale más barato que un cabezal. Y guarda el plotter tapado, el polvo de obra de Santiago mata los encoders.

      Si tu plotter estuvo 3 meses parado, no lo enciendas directo. Llámanos, purgamos el sistema antes para no quemar inyectores secos.
    `},{id:"fotocopiadora-atasco",date:"15 Oct 2024",read:"5 min lectura",title:"Fotocopiadora atascada: 5 pasos para destrabar sin dañarla",excerpt:"Tirar el papel a la fuerza rompe el sensor y cuesta $85.000. Te enseñamos la forma correcta de sacar un atasco en Ricoh, Kyocera y Canon sin llamar al servicio.",content:`
      El atasco es normal: 1 cada 2.000 copias en equipo bien mantenido. El problema es cómo lo sacas.

      **Paso 1: No tires.** Apaga desde el botón, no desenchufes. Espera 30 segundos. Abre las puertas que indica el panel, no todas a la vez. Si la hoja está en el fusor (zona que quema), espera 2 minutos, está a 180°C y te quemas.

      **Paso 2: Dirección importa.** Toda fotocopiadora tiene flechas de flujo. Saca el papel SIEMPRE en dirección del flujo, nunca hacia atrás. Si lo tiras contra el flujo, rompes las uñetas del fusor y las banderitas de sensor. Eso deja marca negra permanente.

      **Paso 3: Revisa lo que no se ve.** El 50% de los atascos "fantasma" son un pedacito de 1cm en el sensor de salida. Con linterna, revisa debajo del fusor y en la unidad dúplex (la que hace doble cara). Si usas papel de 75grs reciclado, se desgarra y deja residuos. Usa mínimo 80grs.

      **Paso 4: Humedad y tipo de papel.** En Santiago, el papel que dejas en la bandeja el fin de semana absorbe humedad y se pega. Si tu oficina cierra viernes a lunes, deja la bandeja cerrada o saca el papel. No mezcles tamaños ni uses papel con grapas o post-it.

      **Paso 5: Cuándo es falla, no atasco.** Si se atasca siempre en el mismo punto (ej: justo antes de salir), es rodillo de registro gastado o embrague. Si marca atasco sin papel, es sensor sucio. No sigas intentando, doblas la puerta y luego no cierra bien.

      **Dato técnico:** En Ricoh MP 301/501, el código SC 542 es fusor, pero si lo reseteas sin enfriar, quemas termistor. En Kyocera M2040, el atasco en bandeja 1 es casi siempre el solenoide de $12.000, no la bandeja.
